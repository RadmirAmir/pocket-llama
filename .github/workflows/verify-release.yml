name: Verify signed community release
on:
  push:
    paths:
      - '.github/workflows/verify-release.yml'
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Draft or published release containing the candidate APK
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 of the exact signed candidate
        required: true
        type: string
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download and verify the exact signed release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag || 'v0.13.1-rc.1' }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 || 'e353801199fb80da92d640e87bb379d7ca32aef58123ec6165491a65b1048d2b' }}
        run: |
          [[ "$CANDIDATE_TAG" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p build/release-candidate
          # Read-only tokens can download the APK once the draft is published.
          for attempt in $(seq 1 60); do
            if gh release view "$CANDIDATE_TAG" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          gh release download "$CANDIDATE_TAG" --pattern 'PocketLlama-*-community-arm64.apk' --dir build/release-candidate
          mv build/release-candidate/*.apk build/release-candidate/candidate.apk
          printf '%s  %s\n' "$CANDIDATE_SHA256" build/release-candidate/candidate.apk | sha256sum --check
          curl --fail --location --retry 3 --output build/release-candidate/baseline.apk https://github.com/RadmirAmir/pocket-llama/releases/download/v0.11.0-rc.3/PocketLlama-0.11.0-community-arm64.apk
          echo 'fe9e47e9ea489a27549a9b760af29df70c7f4303df852273775d8bf2f40c0464  build/release-candidate/baseline.apk' | sha256sum --check
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python3 scripts/prepare-security.py
          python3 scripts/prepare-video.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fresh installation, startup, RC3 upgrade and notes/RAG/video regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 3072M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test-release-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-release-evidence
          path: build/release-candidate/evidence/
