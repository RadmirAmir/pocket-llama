name: Nemotron Android runtime and encrypted recording regression
on:
  push:
    branches: ['feature/nemotron-diarization']
    paths-ignore: ['distribution/release-candidates/**', '.github/workflows/nemotron-candidate.yml']
  pull_request:
    paths: ['native/diarization/**', 'app/src/main/java/dev/pocketllama/voice/**', 'scripts/*diarization*', 'tests/*Diarization*', 'tests/NemotronNativeSmoke.java']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-diarization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build portable JNI and restore pinned test models and runtimes
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          python3 -m pip install cmake==3.31.6 ninja==1.11.1.3
          python3 scripts/prepare-diarization.py
          python3 scripts/build-diarization.py --abi x86_64
          python3 scripts/prepare-security.py
          python3 scripts/prepare-video.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual model, encrypted audio and legacy/current SQLCipher compatibility
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 3072M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p build/diarization-evidence
            bash -o pipefail -c 'python3 scripts/test-diarization-android.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" | tee build/diarization-evidence/native.txt'
            bash -o pipefail -c 'python3 scripts/test-video-android.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" --fixture tests/fixtures/video-tone.m4a | tee build/diarization-evidence/encrypted-store.txt'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nemotron-android-evidence
          path: build/diarization-evidence/
