name: Community APK installation
on:
  push:
    paths:
      - '.github/workflows/install-apk.yml'
      - 'scripts/test-community-install.sh'
      - 'scripts/test-community-installer.py'
      - 'tools/community-installer/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the published APKs and verify exact bytes
        run: |
          mkdir -p build/install
          curl --fail --location --retry 3 --output build/install/community-0.9.0.apk https://github.com/RadmirAmir/pocket-llama/releases/download/v0.9.0-rc.1/PocketLlama-0.9.0-community-arm64.apk
          curl --fail --location --retry 3 --output build/install/community-0.8.0.apk https://github.com/RadmirAmir/pocket-llama/releases/download/v0.8.0-rc.1/PocketLlama-0.8.0-community-arm64.apk
          echo '8cfccbfed0c38e2c53d8f05ae1ecf2dc66522ba7252221d2f133d17c18cc8302  build/install/community-0.9.0.apk' | sha256sum --check
          echo '59612c26dee500d49892b896b5f93ae3a682d3e3db228e0683a767bb1a568bf6  build/install/community-0.8.0.apk' | sha256sum --check
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build the diagnostic installer from source
        env:
          POCKET_INSTALLER_PASSWORD: android
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          keytool -genkeypair -keystore build/install/helper-test.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Pocket Installer CI' -keyalg RSA -keysize 2048 -validity 365
          python3 tools/community-installer/build.py --build-tools "$ANDROID_HOME/build-tools/36.0.0" --android-jar "$ANDROID_HOME/platforms/android-36/android.jar" --keystore build/install/helper-test.keystore
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fresh installation, startup and upgrade on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 3072M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test-community-install.sh
      - name: Retain installer output and Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-install-evidence
          path: install-evidence/
