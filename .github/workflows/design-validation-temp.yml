name: Design validation and build tools
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  design-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare browser and SDK tools
        run: |
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36'
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          mkdir -p build/design-tools
          tar -czf build/design-tools/browser.tar.gz -C "$HOME/.cache/ms-playwright" chromium_headless_shell-*
          tar -czf build/design-tools/jdk.tar.gz -C "$JAVA_HOME" .
          tar -czf build/design-tools/sdk-tools.tar.gz -C "$ANDROID_HOME" build-tools/36.0.0 platforms/android-36/android.jar
      - uses: actions/upload-artifact@v4
        with:
          name: design-validation-tools
          path: build/design-tools/
          retention-days: 1
      - name: Interface regression checks
        run: |
          node scripts/test-studio-ui.cjs
          node scripts/test-scanner-ui.cjs
          node scripts/test-notes-ui.cjs
          node scripts/test-chat-ui.cjs
          node scripts/test-i18n-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-validation-images
          path: |
            build/ux/*.png
            build/scanner-ui/*.png
            build/notes-ux/*.png
            build/chat-qa.png
          retention-days: 1
