name: Verify and publish Pocket 0.14.1 interface update
on:
  push:
    branches: [main]
    paths: ['distribution/release-candidates/0.14.1-nemotron.1.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocket-0141-design
  cancel-in-progress: true
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Reconstruct and check the exact signed APK
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36'
          mkdir -p build/release-candidate/evidence
          curl --fail --location --retry 3 --output build/release-candidate/baseline.apk https://github.com/RadmirAmir/pocket-llama/releases/download/v0.14.0-nemotron.1/PocketLlama-0.14.0-nemotron.1-arm64.apk
          python3 scripts/reconstruct-release-apk.py --manifest distribution/release-candidates/0.14.1-nemotron.1.json --baseline build/release-candidate/baseline.apk --output build/release-candidate/candidate.apk
          source_commit="$(python3 -c "import json; print(json.load(open('distribution/release-candidates/0.14.1-nemotron.1.json'))['sourceCommit'])")"
          git diff --exit-code "$source_commit" HEAD -- app native distribution/release.json
          python3 scripts/verify-design-apk.py --baseline build/release-candidate/baseline.apk --candidate build/release-candidate/candidate.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" verify --verbose --print-certs build/release-candidate/candidate.apk | tee build/release-candidate/evidence/signature.txt
          grep -q 'Signer #1 certificate SHA-256 digest: ef3cea40110c13d179cc7e1f1e570aeb2f870cb7d46f16273eb5d733cf9b2ed0' build/release-candidate/evidence/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 build/release-candidate/candidate.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/release-candidate/candidate.apk > build/release-candidate/evidence/badging.txt
          grep -q "name='dev.pocketllama' versionCode='39' versionName='0.14.1-nemotron.1'" build/release-candidate/evidence/badging.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and update the existing Nemotron release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 3072M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test-design-update-android.sh
      - name: Stage verified candidate
        run: |
          cp build/release-candidate/candidate.apk build/release-candidate/PocketLlama-0.14.1-nemotron.1-arm64.apk
          cd build/release-candidate
          sha256sum PocketLlama-0.14.1-nemotron.1-arm64.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-0141-accepted
          path: |
            build/release-candidate/PocketLlama-0.14.1-nemotron.1-arm64.apk
            build/release-candidate/SHA256SUMS.txt
            build/release-candidate/evidence/
          retention-days: 7
  publish:
    needs: accept
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pocket-0141-accepted
          path: build/accepted
      - name: Publish the verified APK without replacing any release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd build/accepted && sha256sum --check SHA256SUMS.txt)
          source_commit="$(python3 -c "import json; print(json.load(open('distribution/release-candidates/0.14.1-nemotron.1.json'))['sourceCommit'])")"
          if gh release view v0.14.1-nemotron.1 >/dev/null 2>&1; then echo 'Release already exists; refusing replacement'; exit 1; fi
          gh release create v0.14.1-nemotron.1 --target "$source_commit" --prerelease --latest=false --title 'Pocket Llama 0.14.1 — interface update' --notes-file docs/RELEASE-NOTES-0.14.1-nemotron.1.md build/accepted/PocketLlama-0.14.1-nemotron.1-arm64.apk build/accepted/SHA256SUMS.txt
